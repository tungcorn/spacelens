name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  AQTINSTALL_VERSION: "3.3.0"

jobs:
  package:
    name: Build test and package
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      license_present: ${{ steps.gates.outputs.license_present }}
      qt_redist_reviewed: ${{ steps.gates.outputs.qt_redist_reviewed }}
      cli_eligible: ${{ steps.gates.outputs.cli_eligible }}
      gui_eligible: ${{ steps.gates.outputs.gui_eligible }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: pwsh
        run: |
          $prefix = (& .\scripts\install-qt.ps1 -Version $env:QT_VERSION -AqtVersion $env:AQTINSTALL_VERSION |
            Select-Object -Last 1).ToString().Trim()
          if (-not (Test-Path (Join-Path $prefix "lib\cmake\Qt6\Qt6Config.cmake"))) {
            throw "install-qt.ps1 did not return a Qt prefix (got '$prefix')"
          }
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$prefix\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Release
        shell: pwsh
        run: |
          . .\scripts\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          cmake --preset windows-release

      - name: Build Release
        shell: pwsh
        run: |
          . .\scripts\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          cmake --build --preset windows-release

      - name: Full tests
        shell: pwsh
        run: |
          . .\scripts\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          ctest --preset windows-release
          .\build-release\tests\spacelens_tests.exe

      - name: CLI safety gate
        shell: pwsh
        run: .\scripts\verify-cli-safety.ps1 -CliPath .\build-release\cli\spacelens.exe

      - name: Verify tag matches project version
        id: meta
        shell: pwsh
        run: |
          $cache = Get-Content .\build-release\CMakeCache.txt
          $version = $null
          foreach ($line in $cache) {
            if ($line -match '^CMAKE_PROJECT_VERSION:STATIC=(.+)$') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw "CMAKE_PROJECT_VERSION missing" }
          $cli = & .\build-release\cli\spacelens.exe version
          if ($cli -notmatch [regex]::Escape($version)) {
            throw "CLI version '$cli' does not contain CMake version $version"
          }
          $tag = "${{ github.ref_name }}"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            if ($tag -ne "v$version") {
              throw "Tag $tag does not match project version v$version"
            }
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version"

      - name: Stage archives
        shell: pwsh
        run: |
          . .\scripts\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          .\scripts\package-release.ps1 -BuildDir .\build-release -OutDir .\dist

      - name: Distribution gates
        id: gates
        shell: pwsh
        run: |
          # Structured review only. Test-Path of docs/QT_REDIST_REVIEWED.md
          # is intentionally not a gate (empty sentinel must not unlock).
          # This job never creates LICENSE or a review PASS record.
          $licenseText = ""
          if (Test-Path LICENSE) {
            $licenseText = (Get-Content LICENSE -Raw -ErrorAction SilentlyContinue)
          }
          $hasLicense = -not [string]::IsNullOrWhiteSpace($licenseText)

          & .\scripts\verify-qt-redist-review.ps1
          if ($LASTEXITCODE -ne 0) { throw "qt-redist-review.env is malformed" }

          & .\scripts\verify-qt-redist-review.ps1 -RequirePass
          $qtPass = ($LASTEXITCODE -eq 0)

          $cliEligible = $hasLicense
          $guiEligible = $hasLicense -and $qtPass

          if ($hasLicense) { "license_present=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "license_present=false" | Out-File $env:GITHUB_OUTPUT -Append }
          if ($qtPass) { "qt_redist_reviewed=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "qt_redist_reviewed=false" | Out-File $env:GITHUB_OUTPUT -Append }
          if ($cliEligible) { "cli_eligible=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "cli_eligible=false" | Out-File $env:GITHUB_OUTPUT -Append }
          if ($guiEligible) { "gui_eligible=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "gui_eligible=false" | Out-File $env:GITHUB_OUTPUT -Append }

          if (-not $hasLicense) {
            Write-Host "LICENSE missing or empty — GitHub Release publish will be skipped"
          }
          if (-not $qtPass) {
            Write-Host "Qt structured review is not PASS — GUI zip stays a workflow artifact"
          }
          if ($cliEligible -and -not $guiEligible) {
            Write-Host "CLI-only publish is eligible; GUI is withheld (independent gates)"
          }

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacelens-${{ steps.meta.outputs.tag }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: package
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      needs.package.outputs.cli_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docs/release-notes
          sparse-checkout-cone-mode: false

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spacelens-${{ needs.package.outputs.tag }}-windows-x64
          path: dist

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GUI_ELIGIBLE: ${{ needs.package.outputs.gui_eligible }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          # Independent gates: LICENSE unlocks CLI. Structured Qt review
          # PASS+READY unlocks attaching the GUI zip. This job never writes
          # LICENSE, qt-redist-review.env, or QT_REDIST_REVIEWED.md.
          # Checksums attached to the Release must name only uploaded zips.
          # The workflow artifact may still list both archives.
          shopt -s nullglob
          cli_zips=(dist/spacelens-cli-*.zip)
          gui_zips=(dist/spacelens-gui-*.zip)
          if [ "${#cli_zips[@]}" -ne 1 ]; then
            echo "expected exactly one CLI zip, found ${#cli_zips[@]}" >&2
            exit 1
          fi
          attached=("${cli_zips[0]}")
          notes_file="docs/release-notes/${TAG}.md"
          fallback="dist/RELEASE_NOTES.md"
          if [ "$GUI_ELIGIBLE" = "true" ]; then
            if [ "${#gui_zips[@]}" -ne 1 ]; then
              echo "gui_eligible but found ${#gui_zips[@]} GUI zip(s)" >&2
              exit 1
            fi
            attached+=("${gui_zips[0]}")
          fi
          if [ -s "$notes_file" ]; then
            cp "$notes_file" "$fallback"
          elif [ "$GUI_ELIGIBLE" = "true" ]; then
            printf '%s\n' \
              "Unsigned prerelease of SpaceLens ${TAG}." \
              "CLI and GUI archives attached. See docs/RELEASING.md." \
              > "$fallback"
          else
            printf '%s\n' \
              "Unsigned prerelease of SpaceLens ${TAG}." \
              "CLI archive only. GUI zip remains a workflow artifact until the structured Qt review is PASS with source_availability=READY." \
              > "$fallback"
          fi
          : > dist/SHA256SUMS-release.txt
          for f in "${attached[@]}"; do
            base=$(basename "$f")
            grep -F "  ${base}" dist/SHA256SUMS.txt >> dist/SHA256SUMS-release.txt
          done
          if [ "$(wc -l < dist/SHA256SUMS-release.txt)" -ne "${#attached[@]}" ]; then
            echo "filtered checksums do not match attached zip count" >&2
            cat dist/SHA256SUMS-release.txt >&2
            exit 1
          fi
          mv dist/SHA256SUMS-release.txt dist/SHA256SUMS.txt
          gh release create "${TAG}" \
            "${attached[@]}" dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "SpaceLens ${TAG}" \
            --notes-file "$fallback"

  blocked:
    name: Distribution blocked notice
    needs: package
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      needs.package.outputs.cli_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Explain why no GitHub Release was published
        run: |
          echo "LICENSE present: ${{ needs.package.outputs.license_present }}"
          echo "CLI eligible: ${{ needs.package.outputs.cli_eligible }}"
          echo "GUI eligible: ${{ needs.package.outputs.gui_eligible }}"
          echo "Qt structured review PASS: ${{ needs.package.outputs.qt_redist_reviewed }}"
          echo "Archives remain available as workflow artifacts."
          echo "No GitHub Release is created without a non-empty root LICENSE."
