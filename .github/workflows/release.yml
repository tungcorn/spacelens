name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: SpaceLens version (must match CMake project VERSION)
        required: true
      publish:
        description: Create annotated tag, GitHub Release, and trigger npm Trusted Publishing
        type: boolean
        default: false

concurrency:
  group: spacelens-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  AQTINSTALL_VERSION: "3.3.0"

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      run_pipeline: ${{ steps.plan.outputs.run_pipeline }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Classify this run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        shell: pwsh
        run: .\\scripts\\decide-release.ps1

  # ---------------------------------------------------------------------------
  # prepare: runs on a plain main push when decide did NOT select publish.
  # Waits for the pushed SHA's CI, then commits the version bump directly on
  # main and dispatches a workflow_dispatch run of this same workflow to
  # publish the bump commit.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release on main
    needs: decide
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.decide.outputs.run_pipeline != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Determine release need and next version
        id: release_check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\\scripts\\SpaceLensRelease.ps1
          $tags = Get-SpaceLensGitTags
          $latest = Get-SpaceLensLatestStableVersion -Tags $tags
          if (-not $latest) {
            Write-Host "No stable tag found; nothing to release."
            "needed=false" | Out-File $env:GITHUB_OUTPUT -Append
            "next_version=" | Out-File $env:GITHUB_OUTPUT -Append
            "next_tag=" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $commits = Get-SpaceLensCommitsSinceTag -Tag $latest.Tag -Head "HEAD"
          $decision = Get-SpaceLensReleaseDecision -Commits $commits -LatestVersion $latest
          Write-Host (Format-SpaceLensDryRun -Decision $decision -Head "HEAD")
          $needed = $decision.Needed.ToString().ToLower()
          $nextVer = if ($decision.NextVersion) { $decision.NextVersion.Text } else { "" }
          $nextTag = if ($decision.NextVersion) { $decision.NextVersion.Tag } else { "" }
          Write-Host "needed=$needed  next_version=$nextVer  next_tag=$nextTag"
          "needed=$needed" | Out-File $env:GITHUB_OUTPUT -Append
          "next_version=$nextVer" | Out-File $env:GITHUB_OUTPUT -Append
          "next_tag=$nextTag" | Out-File $env:GITHUB_OUTPUT -Append
          "latest_tag=$($latest.Tag)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Skip — no releasable commits
        if: steps.release_check.outputs.needed != 'true'
        run: echo "No releasable commits since latest stable tag. Nothing to prepare."

      - name: Check idempotency (bump already on main or tag exists)
        id: bump_check
        if: steps.release_check.outputs.needed == 'true'
        env:
          NEXT_VERSION: ${{ steps.release_check.outputs.next_version }}
          NEXT_TAG: ${{ steps.release_check.outputs.next_tag }}
        shell: pwsh
        run: |
          # Suppress automatic error-on-non-zero for git external calls
          $ErrorActionPreference = "Continue"
          . .\\scripts\\SpaceLensRelease.ps1

          git fetch origin main 2>&1 | Out-Null

          # Read CMake version on origin/main
          $cmakeRaw = & git show "origin/main:CMakeLists.txt" 2>$null
          $alreadyBumped = $false
          if ($LASTEXITCODE -eq 0 -and $cmakeRaw) {
            $cmakeText = $cmakeRaw -join "`n"
            $current = $null
            try { $current = Get-SpaceLensCMakeVersionFromText $cmakeText } catch { }
            if ($current) {
              $alreadyBumped = ($current.Text -eq $env:NEXT_VERSION)
              Write-Host "main_cmake=$($current.Text)  next=$($env:NEXT_VERSION)  already_bumped=$alreadyBumped"
            }
          }

          # Check if tag already exists on origin
          # Keep ErrorActionPreference=Continue: Get-SpaceLensTagPeelSha calls
          # git rev-parse which exits 1 when the tag does not exist yet.
          $tagPeel = Get-SpaceLensTagPeelSha -Tag $env:NEXT_TAG
          $tagExists = [bool]$tagPeel
          Write-Host "tag_exists=$($tagExists.ToString().ToLower())  already_bumped=$($alreadyBumped.ToString().ToLower())"
          "already_bumped=$($alreadyBumped.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          "tag_exists=$($tagExists.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Skip — bump already on main or tag exists
        if: >
          steps.release_check.outputs.needed == 'true' &&
          (steps.bump_check.outputs.already_bumped == 'true' ||
           steps.bump_check.outputs.tag_exists == 'true')
        env:
          NEXT_VERSION: ${{ steps.release_check.outputs.next_version }}
        run: |
          echo "Version bump for v${NEXT_VERSION} is already on main or tag already exists."
          echo "Skipping prepare; the publish pipeline should already be running or complete."

      - name: Wait for CI of pushed SHA
        if: >
          steps.release_check.outputs.needed == 'true' &&
          steps.bump_check.outputs.already_bumped != 'true' &&
          steps.bump_check.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          REQUIRED=(
            "Windows / Full Debug"
            "Windows / Full Release"
            "Windows / CLI-only Latest"
            "Quality / MSVC Analyze"
            "npm / Package"
            "Release / Policy"
          )
          DEADLINE=$((SECONDS + 7200))   # 120 minutes
          echo "Waiting for required CI checks on ${SHA}..."
          while true; do
            CHECKS="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" --jq '.check_runs')"
            PENDING=()
            FAILED=()
            MISSING=()
            for NAME in "${REQUIRED[@]}"; do
              ROW="$(echo "$CHECKS" | jq -r --arg n "$NAME" '[.[] | select(.name==$n)] | sort_by(.completed_at) | reverse | .[0] // empty')"
              if [ -z "$ROW" ]; then
                MISSING+=("$NAME")
                continue
              fi
              STATUS="$(echo "$ROW" | jq -r '.status')"
              CONCLUSION="$(echo "$ROW" | jq -r '.conclusion // empty')"
              if [ "$CONCLUSION" = "success" ]; then
                echo "  OK: $NAME"
              elif [ "$STATUS" = "completed" ]; then
                FAILED+=("$NAME ($STATUS/$CONCLUSION)")
              else
                PENDING+=("$NAME ($STATUS)")
              fi
            done
            if [ "${#FAILED[@]}" -gt 0 ]; then
              echo "Required CI check(s) FAILED: ${FAILED[*]}" >&2
              exit 1
            fi
            if [ "${#MISSING[@]}" -eq 0 ] && [ "${#PENDING[@]}" -eq 0 ]; then
              echo "All required CI checks passed on ${SHA}."
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "Timed out waiting for CI (missing: ${MISSING[*]:-none}; pending: ${PENDING[*]:-none})" >&2
              exit 1
            fi
            echo "  Waiting... missing=${MISSING[*]:-none} pending=${PENDING[*]:-none}"
            sleep 30
          done

      - name: Prepare version bump commit on main
        id: bump
        if: >
          steps.release_check.outputs.needed == 'true' &&
          steps.bump_check.outputs.already_bumped != 'true' &&
          steps.bump_check.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_check.outputs.next_version }}
          NEXT_TAG: ${{ steps.release_check.outputs.next_tag }}
          ORIGINAL_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\\scripts\\SpaceLensRelease.ps1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Verify main has not moved since this push.
          git fetch origin main
          $originHead = (& git rev-parse "origin/main").Trim()
          if ($originHead -ne $env:ORIGINAL_SHA) {
            Write-Host "main has moved: $($env:ORIGINAL_SHA) → $originHead. Aborting safely."
            exit 1
          }
          git checkout -B main origin/main
          git reset --hard origin/main

          # Bump version files, CHANGELOG, and release notes.
          .\\scripts\\prepare-release.ps1 -Version $env:NEXT_VERSION
          if ($LASTEXITCODE -ne 0) { throw "prepare-release.ps1 failed" }

          # Stage all mechanical version files + CHANGELOG + release notes.
          $toAdd = @(Get-SpaceLensMechanicalVersionFiles) + @(
            "CHANGELOG.md",
            "docs/release-notes/$($env:NEXT_TAG).md"
          )
          foreach ($rel in $toAdd) {
            $path = Join-Path (Get-SpaceLensRepoRoot) ($rel -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (Test-Path -LiteralPath $path) {
              git add -- $rel
              if ($LASTEXITCODE -ne 0) { throw "git add $rel failed" }
            }
          }

          $porcelain = & git status --porcelain
          if (-not "$porcelain".Trim()) {
            throw "prepare-release.ps1 produced no staged changes for $($env:NEXT_VERSION)"
          }

          $subject = "chore(release): prepare SpaceLens $($env:NEXT_TAG)"
          git commit -m $subject
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

          $bumpSha = (& git rev-parse HEAD).Trim()
          Write-Host "bump_sha=$bumpSha"
          "bump_sha=$bumpSha" | Out-File $env:GITHUB_OUTPUT -Append
          "bump_subject=$subject" | Out-File $env:GITHUB_OUTPUT -Append

          # Push — fail safely on non-fast-forward.
          git push origin main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: git push failed (main moved during prepare). No force-push. Aborting."
            exit 1
          }
          Write-Host "Pushed bump commit $bumpSha to main."

      - name: Dispatch publish pipeline for bump commit
        if: >
          steps.release_check.outputs.needed == 'true' &&
          steps.bump_check.outputs.already_bumped != 'true' &&
          steps.bump_check.outputs.tag_exists != 'true' &&
          steps.bump.outputs.bump_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_check.outputs.next_version }}
        run: |
          set -euo pipefail
          echo "Dispatching release.yml workflow_dispatch for v${NEXT_VERSION} publish=true"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f "version=${NEXT_VERSION}" \
            -F "publish=true"
          echo "Dispatched. The publish pipeline will wait for CI of the bump commit."

  preflight:
    name: Preflight
    needs: decide
    if: ${{ needs.decide.outputs.run_pipeline == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify version and publish gates
        id: meta
        env:
          REQUESTED_VERSION: ${{ needs.decide.outputs.version }}
          PUBLISH: ${{ needs.decide.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $publish = ($env:PUBLISH -eq "true")
          .\\scripts\\verify-release-preflight.ps1 -Version $env:REQUESTED_VERSION -Publish:$publish -Wait:$publish
          "version=$($env:REQUESTED_VERSION)" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=v$($env:REQUESTED_VERSION)" | Out-File $env:GITHUB_OUTPUT -Append

  publish-refused:
    name: Publish refused off main
    needs: decide
    if: ${{ needs.decide.outputs.publish == 'true' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          echo "GitHub/npm publication is allowed only from main."
          echo "ref=${GITHUB_REF}"
          exit 1

  package:
    name: Build test and package
    needs: [decide, preflight]
    if: ${{ needs.decide.outputs.run_pipeline == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      unified_sha256: ${{ steps.hash.outputs.unified_sha256 }}
      cli_sha256: ${{ steps.hash.outputs.cli_sha256 }}
      license_present: ${{ steps.gates.outputs.license_present }}
      qt_redist_reviewed: ${{ steps.gates.outputs.qt_redist_reviewed }}
      cli_eligible: ${{ steps.gates.outputs.cli_eligible }}
      gui_eligible: ${{ steps.gates.outputs.gui_eligible }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: pwsh
        run: |
          $prefix = (& .\\scripts\\install-qt.ps1 -Version $env:QT_VERSION -AqtVersion $env:AQTINSTALL_VERSION |
            Select-Object -Last 1).ToString().Trim()
          if (-not (Test-Path (Join-Path $prefix "lib\\cmake\\Qt6\\Qt6Config.cmake"))) {
            throw "install-qt.ps1 did not return a Qt prefix (got '$prefix')"
          }
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$prefix\\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Release
        shell: pwsh
        run: |
          . .\\scripts\\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          cmake --preset windows-release

      - name: Build Release
        shell: pwsh
        run: |
          . .\\scripts\\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          cmake --build --preset windows-release

      - name: Full tests
        shell: pwsh
        run: |
          . .\\scripts\\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          ctest --preset windows-release
          .\\build-release\\tests\\spacelens_tests.exe

      - name: CLI safety gate
        shell: pwsh
        run: .\\scripts\\verify-cli-safety.ps1 -CliPath .\\build-release\\cli\\spacelens.exe

      - name: Verify built version
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        shell: pwsh
        run: |
          $cache = Get-Content .\\build-release\\CMakeCache.txt
          $version = $null
          foreach ($line in $cache) {
            if ($line -match '^CMAKE_PROJECT_VERSION:STATIC=(.+)$') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw "CMAKE_PROJECT_VERSION missing" }
          if ($version -ne $env:EXPECTED_VERSION) {
            throw "built CMake version $version != requested $($env:EXPECTED_VERSION)"
          }
          $cli = & .\\build-release\\cli\\spacelens.exe version
          if ($cli -notmatch [regex]::Escape($version)) {
            throw "CLI version '$cli' does not contain CMake version $version"
          }
          $caps = & .\\build-release\\cli\\spacelens.exe capabilities --json | ConvertFrom-Json
          if ($caps.filesystem_mutation -ne $false) { throw "filesystem_mutation is not false" }
          if ($caps.read_only -ne $true) { throw "read_only is not true" }
          .\\scripts\\verify-mcp-safety.ps1 -McpPath .\\build-release\\mcp\\spacelens-mcp.exe -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { throw "MCP safety/version gate failed" }
          Write-Host "built version=$version"

      - name: Stage archives
        shell: pwsh
        run: |
          . .\\scripts\\use-msvc.ps1
          if (-not (Import-SpaceLensMsvc)) { throw "MSVC vcvars not found" }
          .\\scripts\\package-release.ps1 -BuildDir .\\build-release -OutDir .\\dist

      - name: Record archive hashes
        id: hash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: pwsh
        run: |
          $main = Join-Path .\\dist "spacelens-$($env:TAG)-windows-x64.zip"
          $cli = Join-Path .\\dist "spacelens-cli-$($env:TAG)-windows-x64.zip"
          if (-not (Test-Path $main)) { throw "missing $main" }
          if (-not (Test-Path $cli)) { throw "missing $cli" }
          $mainHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $main).Hash.ToLowerInvariant()
          $cliHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $cli).Hash.ToLowerInvariant()
          $sums = Get-Content .\\dist\\SHA256SUMS.txt
          if ($sums -notcontains "$mainHash  $(Split-Path $main -Leaf)") {
            throw "SHA256SUMS.txt missing verified unified hash"
          }
          if ($sums -notcontains "$cliHash  $(Split-Path $cli -Leaf)") {
            throw "SHA256SUMS.txt missing verified CLI hash"
          }
          "unified_sha256=$mainHash" | Out-File $env:GITHUB_OUTPUT -Append
          "cli_sha256=$cliHash" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "unified $mainHash"
          Write-Host "cli $cliHash"

      - name: Stage npm package from this run's unified zip
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          UNIFIED_SHA256: ${{ steps.hash.outputs.unified_sha256 }}
        shell: pwsh
        run: |
          $zip = Join-Path .\\dist "spacelens-$($env:TAG)-windows-x64.zip"
          .\\scripts\\package-npm.ps1 -Version $env:VERSION -ZipPath $zip -ExpectedSha256 $env:UNIFIED_SHA256
          .\\scripts\\verify-npm-package.ps1

      - name: Distribution gates
        id: gates
        shell: pwsh
        run: |
          $licenseText = ""
          if (Test-Path LICENSE) {
            $licenseText = (Get-Content LICENSE -Raw -ErrorAction SilentlyContinue)
          }
          $hasLicense = -not [string]::IsNullOrWhiteSpace($licenseText)

          & .\\scripts\\verify-qt-redist-review.ps1
          if ($LASTEXITCODE -ne 0) { throw "qt-redist-review.env is malformed" }

          & .\\scripts\\verify-qt-redist-review.ps1 -RequirePass
          $qtPass = ($LASTEXITCODE -eq 0)

          $cliEligible = $hasLicense
          $guiEligible = $hasLicense -and $qtPass

          if ($hasLicense) { "license_present=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "license_present=false" | Out-File $env:GITHUB_OUTPUT -Append }
          if ($qtPass) { "qt_redist_reviewed=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "qt_redist_reviewed=false" | Out-File $env:GITHUB_OUTPUT -Append }
          if ($cliEligible) { "cli_eligible=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "cli_eligible=false" | Out-File $env:GITHUB_OUTPUT -Append }
          if ($guiEligible) { "gui_eligible=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "gui_eligible=false" | Out-File $env:GITHUB_OUTPUT -Append }

          if (-not $hasLicense) {
            Write-Host "LICENSE missing or empty — GitHub Release publish will be skipped"
          }
          if (-not $qtPass) {
            Write-Host "Qt structured review is not PASS — unified zip stays a workflow artifact"
          }

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacelens-${{ needs.preflight.outputs.tag }}-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish-blocked:
    name: Publish blocked by distribution gates
    needs: [decide, package]
    if: >
      needs.decide.outputs.publish == 'true' &&
      github.ref == 'refs/heads/main' &&
      (needs.package.outputs.cli_eligible != 'true' ||
       needs.package.outputs.gui_eligible != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse incomplete release
        run: |
          echo "CLI eligible: ${{ needs.package.outputs.cli_eligible }}"
          echo "GUI eligible: ${{ needs.package.outputs.gui_eligible }}"
          echo "Refusing to publish a partial v* GitHub Release."
          exit 1

  publish-github:
    name: Publish GitHub Release
    needs: [decide, package]
    if: >
      needs.decide.outputs.publish == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      needs.package.outputs.cli_eligible == 'true' &&
      needs.package.outputs.gui_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.package.outputs.tag }}
      created_at: ${{ steps.create.outputs.created_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spacelens-${{ needs.package.outputs.tag }}-windows-x64
          path: dist

      - name: Create annotated tag and latest release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          peeled="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
          if [ -z "$peeled" ]; then
            peeled="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          fi
          if [ -n "$peeled" ]; then
            if [ "$peeled" != "${GITHUB_SHA}" ]; then
              echo "refusing to move existing tag ${TAG} (points at ${peeled}, not ${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "tag ${TAG} already points at ${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "SpaceLens ${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cli_zip="dist/spacelens-cli-${TAG}-windows-x64.zip"
          main_zip="dist/spacelens-${TAG}-windows-x64.zip"
          if [ ! -f "$cli_zip" ] || [ ! -f "$main_zip" ] || [ ! -f dist/SHA256SUMS.txt ]; then
            echo "required release assets missing" >&2
            ls -la dist >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; verifying assets (will not replace)"
            assets="$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
            for need in "spacelens-${TAG}-windows-x64.zip" "spacelens-cli-${TAG}-windows-x64.zip" "SHA256SUMS.txt"; do
              if ! printf '%s\n' "$assets" | grep -Fxq "$need"; then
                echo "existing Release ${TAG} is missing ${need}" >&2
                exit 1
              fi
            done
            draft="$(gh release view "${TAG}" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '"\\(.isDraft) \\(.isPrerelease)"')"
            if [ "$draft" != "false false" ]; then
              echo "existing Release ${TAG} is draft/prerelease: ${draft}" >&2
              exit 1
            fi
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          notes_file="docs/release-notes/${TAG}.md"
          fallback="dist/RELEASE_NOTES.md"
          if [ -s "$notes_file" ]; then
            cp "$notes_file" "$fallback"
          else
            printf '%s\n' \
              "SpaceLens ${TAG}." \
              "Unified (GUI + CLI + MCP) and headless (CLI + MCP) archives attached. See docs/RELEASING.md." \
              > "$fallback"
          fi
          gh release create "${TAG}" \
            "$main_zip" "$cli_zip" dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --latest \
            --verify-tag \
            --title "SpaceLens ${TAG}" \
            --notes-file "$fallback"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  wait-npm:
    name: Dispatch npm Trusted Publishing
    needs: [package, publish-github]
    if: ${{ needs.publish-github.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Dispatch npm-publish.yml and verify registry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          UNIFIED_SHA256: ${{ needs.package.outputs.unified_sha256 }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${UNIFIED_SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "unified_sha256 is not a 64-char hex digest: '${UNIFIED_SHA256}'" >&2
            exit 1
          fi
          got_now="$(npm view "@tungcorn/spacelens@${VERSION}" version 2>/dev/null || true)"
          if [ "$got_now" = "$VERSION" ]; then
            echo "npm already has @tungcorn/spacelens@${VERSION}; skipping dispatch"
            latest="$(npm view @tungcorn/spacelens version)"
            echo "npm @tungcorn/spacelens@${VERSION} present; latest=${latest}"
            exit 0
          fi
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Dispatching npm-publish.yml version=${VERSION} sha256=${UNIFIED_SHA256}"
          set +e
          resp="$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/npm-publish.yml/dispatches" \
            -f ref=main \
            -f "inputs[version]=${VERSION}" \
            -F "inputs[publish]=true" \
            -f "inputs[sha256]=${UNIFIED_SHA256}")"
          api_status=$?
          set -e
          run_id="$(printf '%s' "$resp" | jq -r '.workflow_run_id // empty' 2>/dev/null || true)"
          if [ -z "$run_id" ]; then
            echo "API did not return workflow_run_id (status=${api_status}); polling by created_at (ref=main may have moved)"
            deadline=$((SECONDS + 180))
            while (( SECONDS < deadline )); do
              run_id="$(gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/npm-publish.yml/runs?event=workflow_dispatch&per_page=20" \
                | jq -r --arg since "$since" '
                  [.workflow_runs[]
                    | select(.created_at >= $since)]
                  | sort_by(.created_at)
                  | reverse
                  | .[0].id // empty')"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done
          fi
          if [ -z "$run_id" ]; then
            echo "failed to start npm-publish.yml" >&2
            echo "GitHub Release is immutable. Fix npm separately; do not retag." >&2
            exit 1
          fi
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          echo "watching npm-publish run ${run_id} head_sha=${head_sha} (may differ from GITHUB_SHA if main moved)"
          if ! gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status; then
            echo "npm-publish.yml failed. GitHub Release ${VERSION} is immutable. Do not retag." >&2
            exit 1
          fi
          got="$(npm view "@tungcorn/spacelens@${VERSION}" version)"
          if [ "$got" != "$VERSION" ]; then
            echo "npm view returned '$got' wanted ${VERSION}" >&2
            exit 1
          fi
          latest="$(npm view @tungcorn/spacelens version)"
          echo "npm @tungcorn/spacelens@${VERSION} published; latest=${latest}"

  pin-public-hash:
    name: Pin public unified hash
    needs: [package, wait-npm]
    if: ${{ needs.wait-npm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Hash the public unified zip and pin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          .\\scripts\\update-release-pin.ps1 -Version $env:VERSION -Repo $env:GITHUB_REPOSITORY -WriteFiles
          if ($LASTEXITCODE -ne 0) { throw "update-release-pin.ps1 failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packaging/npm/release-pin.env docs/RELEASING.md
          $dirty = git status --porcelain
          if ("$dirty".Trim()) {
            git commit -m "chore(npm): pin pack-from-release to public v$($env:VERSION) hash"
            git push origin main
            if ($LASTEXITCODE -ne 0) { throw "pin push failed; public release stands — retry this job" }
          } else {
            Write-Host "release pin already current; not committing"
          }
          gh workflow run ci.yml --ref main
          if ($LASTEXITCODE -ne 0) { throw "failed to dispatch ci.yml after pin" }
