name: npm publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: SpaceLens version (must match packaging/npm/release-pin.env)
        required: true
        default: "0.1.1"
      publish:
        description: Publish the verified tarball to registry.npmjs.org
        type: boolean
        default: false

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack and validate
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Template and launcher tests
        shell: pwsh
        run: .\scripts\verify-npm-template.ps1

      - name: Stage npm package from published release
        shell: pwsh
        run: .\scripts\package-npm.ps1 -Version "${{ inputs.version }}"

      - name: Validate tarball and isolated install
        shell: pwsh
        run: .\scripts\verify-npm-package.ps1

      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm
    needs: pack
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm CLI with Trusted Publishing support
        shell: pwsh
        run: npm install -g npm@11

      - name: Download verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: dist

      - name: Publish
        shell: pwsh
        run: |
          $tgz = Get-ChildItem .\dist\*.tgz | Select-Object -First 1
          if (-not $tgz) { throw "verified tarball missing" }
          Write-Host "Publishing $($tgz.Name)"
          npm publish $tgz.FullName --access public

  publish-refused:
    name: Publish refused off main
    if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse
        run: |
          echo "npm publish is allowed only from main after pack validation."
          echo "ref=${GITHUB_REF}"
          exit 1
